<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Player de IPTV para listas M3U e contas Xtream Codes.">
  <title>Sintonia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar" aria-label="Seções"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="player" hidden tabindex="-1" aria-label="Player"></div>
  <div id="task" hidden><span class="task-spin"></span><span class="task-text"></span></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>O Sintonia precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
